# Ejemplo ficticio para https://cat.trivierepartners.com/acme/
# La imagen es específica del cliente de prueba acme.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cat-acme-config
data:
  APP_NAME: cat
  CLIENT_NAME: acme
  MONGO_COLLECTION: acme
  PORT: "3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cat-acme
  labels:
    app.kubernetes.io/name: cat
    app.kubernetes.io/instance: acme
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cat
      app.kubernetes.io/instance: acme
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cat
        app.kubernetes.io/instance: acme
    spec:
      imagePullSecrets:
        - name: triviere-registry
      containers:
        - name: app
          image: ghcr.io/OWNER/cat-acme:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: cat-acme-config
            - secretRef:
                name: cat-acme-secrets
          readinessProbe:
            httpGet:
              path: /acme/api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /acme/api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: cat-acme
  labels:
    app.kubernetes.io/name: cat
    app.kubernetes.io/instance: acme
spec:
  selector:
    app.kubernetes.io/name: cat
    app.kubernetes.io/instance: acme
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cat-acme
spec:
  ingressClassName: nginx
  rules:
    - host: cat.trivierepartners.com
      http:
        paths:
          - path: /acme
            pathType: Prefix
            backend:
              service:
                name: cat-acme
                port:
                  name: http
  tls:
    - hosts:
        - cat.trivierepartners.com
      secretName: trivierepartners-tls
